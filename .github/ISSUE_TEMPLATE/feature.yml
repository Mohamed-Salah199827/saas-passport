name: Feature proposal
description: Propose a package capability or contributor workflow improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the portability problem and who encounters it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Include expected behavior, limitations, and a roadmap reference if one exists.
    validations:
      required: true
