name: Bug report
description: Report a reproducible problem using synthetic data
title: "bug: "
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the commit or version, PHP version, and OS.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Use a minimal synthetic example and redact credentials before posting.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
